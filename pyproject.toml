[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbeat-insights"
version = "0.1.0"
description = "Governed LLM theme summaries for anonymous staff check-ins: redaction, k-threshold, human review, audit log, bias tests."
requires-python = ">=3.10"
dependencies = []  # standard library only; providers call HTTP APIs directly

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
heartbeat-insights = "heartbeat_insights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
